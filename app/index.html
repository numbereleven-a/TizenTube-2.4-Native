<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=1920"><title>TizenTube-2.4-Native</title><link rel="stylesheet" href="style.css"></head><body>
<div id="native-container"></div>
<main id="home">
<aside id="rail"><div class="brand"><span>TizenTube<small>2.4-Native</small><small id="brand-version"></small></span></div><nav id="nav-items"></nav></aside>
<div id="content"><header><h1 id="section-title">Главная</h1><div class="top-actions"><button id="top-search" type="button" aria-label="Поиск"><img src="icons/search.png" alt="Поиск"></button><button id="top-account" type="button" aria-label="Аккаунт"><img src="icons/person.png" alt=""><span id="profile-label">Аккаунт</span></button><button id="settings-button" type="button" aria-label="Настройки"><img src="icons/settings.png" alt="Настройки"></button></div></header>
<div id="categories"></div><button id="my-channels" type="button" hidden>Мои каналы</button><p id="status">Загрузка…</p><p id="boot-version"></p>
<form id="search-form" hidden><input id="query" type="text" placeholder="Поиск или ссылка YouTube" autocomplete="off"><button id="search" type="submit">Найти</button></form>
<div id="search-suggestions" hidden></div>
<section id="settings" hidden>
<p id="app-version"></p>
<div id="settings-layout"><div id="settings-menu"><h2 id="settings-heading"></h2><div id="settings-options"></div></div><div id="settings-detail"><p id="settings-description"></p><canvas id="settings-qr" hidden></canvas><pre id="settings-notice" hidden></pre></div></div>
</section>
<section id="account-panel" hidden><h2>Ваш аккаунт YouTube</h2><p id="account-status">Войдите, чтобы видеть свои подписки и рекомендации</p>
<div id="signed-out"><button id="login-start" type="button" class="primary">Войти по QR-коду</button><div id="qr-view" hidden><div class="login-steps"><h3>Откройте на телефоне</h3><p id="login-url"></p><h3>Введите код или отсканируйте QR</h3><p id="login-code"></p><button id="login-cancel" type="button">Отмена</button></div><canvas id="qr" width="400" height="400"></canvas></div></div>
<div id="signed-in" hidden><div class="profile-icon"><img src="icons/person.png" alt=""></div><h3 id="account-name"></h3><p id="account-handle"></p><button id="account-subscriptions" type="button" class="primary">Перейти к подпискам</button><button id="logout" type="button">Выйти</button></div></section>
<section id="empty" hidden><img src="icons/person.png" alt=""><h2 id="empty-text"></h2><button id="empty-login" type="button" class="primary">Аккаунт</button></section>
<section id="results"></section><div id="feed-loading" hidden>Загрузка видео…</div><button id="more" type="button" hidden>Ещё видео</button></div><section id="search-keyboard" aria-label="Клавиатура поиска" hidden></section></main>
<section id="hud" hidden><div class="hud-top"><span class="pill">TizenTube-2.4-Native</span><span id="format"></span><span id="media-tls"></span><span id="sb-status">SponsorBlock</span></div><h2 id="title"></h2><p id="play-state"></p><div class="timeline" id="seek-bar" tabindex="0" role="slider" aria-label="Перемотка"><div id="progress"></div><div id="seek-change" hidden></div><div id="sponsor-segments"></div><div id="seek-marker" hidden></div></div><div class="hud-bottom"><span id="time">0:00</span><span id="seek-preview" hidden></span><span>← → перемотка &nbsp; ↑ переход &nbsp; OK панель &nbsp; ↓ кнопки &nbsp; Назад к списку</span></div><div id="play-actions"><button id="play-pause">Ⅱ Пауза</button><button id="play-quality"><img src="icons/settings.png" alt=""> Качество</button><button id="play-like" aria-pressed="mixed"><img src="icons/thumb_up.png" alt=""><span id="play-like-label">Лайк</span></button><button id="play-subscribe">+ Подписаться</button><button id="play-channel">На канал</button><button id="play-captions">CC Субтитры</button><button id="play-sponsor">SponsorBlock</button><button id="play-more">••• Ещё</button></div></section>
<div id="pause-indicator" hidden aria-hidden="true"><span></span><span></span></div><div id="captions"></div><section id="play-options" hidden></section><div id="toast" hidden></div>
<script src="$WEBAPIS/webapis/webapis.js"></script><script src="promise-polyfill.js"></script><script src="hls.js"></script><script src="i18n.js"></script><script src="qrcode.js"></script><script src="diagnostics.js"></script><script src="network.js"></script><script src="hls-proxy.js"></script><script src="account.js"></script><script src="decipher.js"></script><script src="youtube.js"></script><script src="sponsorblock.js"></script><script src="settings.js"></script><script src="shell.js"></script><script src="playback-controls.js"></script><script src="watch-history.js"></script><script src="search-keyboard.js"></script><script src="app.js"></script></body></html>
